<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121214">
  <title>Smart Lamp</title>

  <!-- Подключение манифеста PWA -->
  <link rel="manifest" href="manifest.json">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121214; color: #fff; margin: 0; padding: 20px; text-align: center; }
    .card { background: #1e1e24; border-radius: 24px; max-width: 380px; margin: auto; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
    h1 { font-size: 22px; margin-bottom: 8px; color: #60a5fa; }
    #status { font-size: 13px; color: #ef4444; margin-bottom: 20px; font-weight: bold; }
    .btn-connect { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; border: none; background: #2563eb; color: white; cursor: pointer; margin-bottom: 20px; }
    .btn-power { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 14px; border: none; background: #10b981; color: white; cursor: pointer; margin-bottom: 25px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .btn-action { padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #2a2a35; color: #e5e7eb; font-size: 15px; font-weight: 600; cursor: pointer; }
    .grid-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-mode { padding: 14px; border-radius: 12px; border: 1px solid #374151; background: #22222b; color: #93c5fd; font-weight: 600; cursor: pointer; }
    .btn-mode:active, .btn-action:active { background: #3b82f6; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <h1>ESP32 Светильник</h1>
    <div id="status">● Отключено</div>

    <button class="btn-connect" onclick="connectBLE()">Подключить Bluetooth</button>
    <button class="btn-power" onclick="send('p')">ВКЛ / ВЫКЛ</button>

    <div class="controls">
      <button class="btn-action" onclick="send('+')">Яркость +</button>
      <button class="btn-action" onclick="send('-')">Яркость -</button>
      <button class="btn-action" onclick="send('>')">Скорость +</button>
      <button class="btn-action" onclick="send('<')">Скорость -</button>
    </div>

    <div class="grid-modes">
      <button class="btn-mode" onclick="send('1')">1. Статика</button>
      <button class="btn-mode" onclick="send('2')">2. Бег</button>
      <button class="btn-mode" onclick="send('3')">3. Полиция</button>
      <button class="btn-mode" onclick="send('4')">4. Огонь</button>
      <button class="btn-mode" style="grid-column: span 2;" onclick="send('5')">5. Волна</button>
    </div>
  </div>

  <script>
    // Регистрация Service Worker для PWA установки
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    let rxCharacteristic = null;

    async function connectBLE() {
      try {
        document.getElementById('status').innerText = "Поиск устройства...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32-Smart-Lamp' }],
          optionalServices: [SERVICE_UUID]
        });

        document.getElementById('status').innerText = "Подключение...";
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(RX_CHAR_UUID);

        document.getElementById('status').innerText = "● Подключено к ESP32";
        document.getElementById('status').style.color = "#10b981";

        device.addEventListener('gattserverdisconnected', () => {
          document.getElementById('status').innerText = "● Отключено";
          document.getElementById('status').style.color = "#ef4444";
        });
      } catch (error) {
        console.log(error);
        document.getElementById('status').innerText = "Ошибка: " + error;
      }
    }

    async function send(cmd) {
      if (!rxCharacteristic) {
        alert("Сначала нажми 'Подключить Bluetooth'!");
        return;
      }
      const encoder = new TextEncoder();
      await rxCharacteristic.writeValue(encoder.encode(cmd));
    }
  </script>
</body>
</html>
